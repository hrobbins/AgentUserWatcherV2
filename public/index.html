<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent User Watcher — Progress</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <h1>Study Progress</h1>
        <p class="subtitle" id="day-summary">Loading…</p>
      </header>

      <section class="progress">
        <div class="progress__total">
          <span id="unit-total">0</span>
          <span class="progress__goal"> / <span id="unit-goal">12</span> units</span>
        </div>
        <div class="progress__bar" id="progress-bar"></div>
        <p class="progress__status" id="progress-status"></p>
      </section>

      <section class="subjects">
        <h2>Per Subject</h2>
        <div class="subject-grid" id="subject-grid"></div>
      </section>

      <section class="timeline">
        <h2>Recent Activity</h2>
        <div class="sample-latest" id="sample-latest"></div>
        <div class="sample-list" id="sample-list"></div>
      </section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
