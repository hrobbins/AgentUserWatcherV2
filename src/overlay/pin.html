<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { font-family: "Segoe UI", sans-serif; padding: 20px; background: #1e1e1e; color: #eee; }
  h2 { margin: 0 0 6px; font-weight: 400; }
  p { opacity: 0.65; margin: 0 0 14px; font-size: 13px; }
  input[type=password] {
    width: 100%; padding: 10px; font-size: 18px; background: #2a2a2a;
    border: 1px solid #444; color: #eee; border-radius: 4px; box-sizing: border-box;
  }
  button {
    margin-top: 12px; padding: 8px 18px; font-size: 14px;
    background: #3a7; border: 0; color: #fff; border-radius: 4px; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { margin-top: 10px; color: #f66; min-height: 18px; font-size: 13px; }
</style>
</head>
<body>
<script>
  const params = new URLSearchParams(window.location.search);
  const mode = params.get('mode') || 'override';
  document.write(mode === 'admin'
    ? '<h2>Admin access</h2><p>Enter PIN to open subject settings.</p>'
    : '<h2>Parent override</h2><p>Enter PIN to grant a 15-minute override.</p>');
</script>
<input id="pin" type="password" autofocus />
<button id="submit">Unlock</button>
<div id="status"></div>
<script>
  const input = document.getElementById('pin');
  const status = document.getElementById('status');
  const btn = document.getElementById('submit');

  async function submit() {
    btn.disabled = true;
    const r = await window.overlay.submitPin(input.value, mode);
    btn.disabled = false;
    if (r && r.ok) {
      window.close();
    } else {
      status.textContent = 'Incorrect PIN';
      input.value = '';
      input.focus();
    }
  }

  btn.addEventListener('click', submit);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
</script>
</body>
</html>
